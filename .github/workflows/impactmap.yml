name: ImpactMap

on:
  pull_request:

permissions:
  contents: read

jobs:
  impact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Analyze pull request impact
        uses: ./.github/actions/impactmap
        env:
          IMPACTMAP_DISABLE_CODE_CONFIG: "1"
        with:
          base: ${{ github.event.pull_request.base.sha }}
          command: impact
          fail-on: never
